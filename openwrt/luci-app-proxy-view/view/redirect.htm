<%+header%>

<div class="cbi-map">
  <h2 name="content"><%:多线代理控制台%></h2>
  <div class="cbi-section">
    <p><%:正在打开 Mihomo 多线代理控制台…%></p>
    <p><a id="proxy-view-link" class="cbi-button cbi-button-action"><%:立即打开%></a></p>
  </div>
</div>

<script type="text/javascript">
  (function () {
    var hostname = window.location.hostname;
    var host = hostname.indexOf(':') >= 0 ? '[' + hostname + ']' : hostname;
    var base = 'http://' + host + ':9090/ui/proxy-view/';
    var link = document.getElementById('proxy-view-link');
    link.href = base;
    XHR.get('<%=luci.dispatcher.build_url("admin","services","proxy-view","dashboard-token")%>', null, function (xhr, data) {
      var target = base;
      if (data && typeof data.secret === 'string' && data.secret) {
        target += '#proxy-view-auth=' + encodeURIComponent(data.secret);
      }
      link.href = target;
      window.setTimeout(function () { window.location.replace(target); }, 100);
    });
  }());
</script>

<%+footer%>
